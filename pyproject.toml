[project]
name = "signal_foundry_mcp"
version = "0.1.0"
description = "An MCP powered competitor pricing analyst."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5.0,<4.10.0",
    "anthropic>=0.52.0",
    "firecrawl-py>=2.8.0",
    "mcp==1.10.1",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
